services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  extract:
    build:
      context: .
      dockerfile: extract/Dockerfile
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: "no"

  etl:
    build:
      context: .
      dockerfile: loader/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      extract:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    restart: "no"

  dashboard:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    ports:
      - "8501:8501"

  tests:
    build:
      context: .
      dockerfile: loader/Dockerfile
    env_file: .env
    command: ["pytest", "-v", "tests/"]
    profiles: ["test"]

volumes:
  pgdata: